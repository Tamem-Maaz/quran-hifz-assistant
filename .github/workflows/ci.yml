name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      # خطوة Playwright تُضاف عند وجود تدفقات حرجة فعلية للاختبار (المرحلة 2 فصاعدًا،
      # راجع القسم 16 من docs/PROJECT_PLAN.md) — تشغيلها الآن بلا اختبارات e2e مضلِّل.
